version: "3.9"

services:
  api:
    build: .
    container_name: agrisense_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - ./uploads:/app/uploads
      - ./chroma_data:/app/chroma_data
    depends_on:
      - chromadb
    restart: always

  chromadb:
    image: chromadb/chroma:latest
    container_name: agrisense_chromadb
    ports:
      - "8001:8001"
    volumes:
      - ./chroma_data:/chroma/.chromadb
