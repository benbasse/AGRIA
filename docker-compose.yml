version: "3.9"

networks:
  agrisense-network:
    driver: bridge

services:
  api:
    build: .
    container_name: agrisense_api
    ports:
      - "127.0.0.1:8000:8000"  # Bind only to localhost for security
    env_file:
      - .env
    volumes:
      - .:/app
      - ./uploads:/app/uploads
      - ./chroma_data:/app/chroma_data
    depends_on:
      - chromadb
    restart: always
    networks:
      - agrisense-network

  chromadb:
    image: chromadb/chroma:latest
    container_name: agrisense_chromadb
    ports:
      - "127.0.0.1:8001:8001"  # Bind only to localhost
    volumes:
      - ./chroma_data:/chroma/.chromadb
    restart: always
    networks:
      - agrisense-network
